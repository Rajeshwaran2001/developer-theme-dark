name: Check SVG icon colors

on:
  pull_request:
    paths:
      - 'icons/*.svg'

permissions:
  contents: read

jobs:
  color-check:
    name: SVG Color Check
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # svg-color-linter declares `engines.bun`, so it runs under bun, not npm.
      - name: Setup Bun ⚙️
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check colors 🎨
        run: |
          svgFiles=$(git diff origin/${{ env.TARGET_BRANCH }} --name-only -- 'icons/*.svg')
          if [ -z "$svgFiles" ]; then
            echo "No changed SVG icons to check."
            exit 0
          fi
          bunx svg-color-linter --colors material-colors.yml $svgFiles
