name: Check SVG icon colors

on:
  pull_request:
    paths:
      - 'icons/*.svg'

permissions:
  contents: read

jobs:
  color-check:
    name: SVG Color Check
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # svg-color-linter declares `engines.bun`, so it runs under bun, not npm.
      - name: Setup Bun ⚙️
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check colors 🎨
        run: |
          base="origin/${TARGET_BRANCH}"
          added=$(git diff "$base" --name-only --diff-filter=A -- 'icons/*.svg')
          modified=$(git diff "$base" --name-only --diff-filter=M -- 'icons/*.svg')

          # Existing icons are grandfathered: ~86 of them use official brand
          # colours (Vue, webpack, Swift, ...) that predate this check and are
          # deliberately off-palette. Report them, but never fail on them.
          if [ -n "$modified" ]; then
            echo "::group::Palette report for modified icons (advisory only)"
            # v3 renamed `--colors` to `--config`; the major is pinned so a
            # future rename cannot silently break this job again.
            bunx svg-color-linter@3 --config material-colors.yml $modified || true
            echo "::endgroup::"
          fi

          # New icons must follow the Material palette.
          if [ -z "$added" ]; then
            echo "No newly added icons to check."
            exit 0
          fi
          echo "Checking $(echo "$added" | wc -l) newly added icon(s)..."
          bunx svg-color-linter@3 --config material-colors.yml $added
